name: SBOM

# Generates a CycloneDX Software Bill of Materials for iMirror's managed
# dependencies. Kept as a separate workflow (not part of CI) so the build
# status stays independent of SBOM tooling. Runs on release tags and can be
# triggered manually to validate the tool invocation.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore iMirror.sln

      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet CycloneDX iMirror.sln -o sbom --json
          Get-ChildItem -Recurse sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imirror-sbom
          path: sbom/*
          if-no-files-found: error
